<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABDO STORE 🎧</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>🎧 ABDO STORE</h1>
  <button id="cartBtn">🛒 السلة (<span id="cartCount">0</span>)</button>
</header>

<section class="hero">
  <h2>سماعاتك المفضلة هنا 🔥</h2>
  <p>جودة • أناقة • سعر مناسب</p>
</section>

<section class="products">

  <div class="product">
    <img src="https://via.placeholder.com/300" alt="P9 Pro Max">
    <h3>P9 Pro Max</h3>
    <p class="price">1800 دج</p>
    <button onclick="addToCart('P9 Pro Max', 1800)">
      أضف للسلة
    </button>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/300" alt="AirPods">
    <h3>AirPods</h3>
    <p class="price">1500 دج</p>
    <button onclick="addToCart('AirPods', 1500)">
      أضف للسلة
    </button>
  </div>

</section>

<div id="cart" class="cart">
  <button onclick="closeCart()">✕</button>
  <h2>🛒 سلة المشتريات</h2>
  <div id="cartItems"></div>
  <h3>المجموع: <span id="total">0</span> دج</h3>
</div>

<script src="script.js"></script>

</body>
</html>
